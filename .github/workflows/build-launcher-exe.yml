name: Build Windows EXE

on:
  push:
    branches: ["vibe/universal-launcher-fa0dfa"]
    paths:
      - "launcher-python/**"
      - ".github/workflows/build-launcher-exe.yml"
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Okelauncher.exe (GUI) and Okelauncher-cli.exe (terminal)
        run: |
          pyinstaller --onefile --windowed --name Okelauncher launcher-python/launch.py
          pyinstaller --onefile --console --name Okelauncher-cli launcher-python/launch.py

      - name: Smoke test (console EXE)
        run: ./dist/Okelauncher-cli.exe --list

      - name: Smoke test (GUI EXE exit code)
        run: ./dist/Okelauncher.exe --list
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: Okelauncher-windows-exe
          path: dist/Okelauncher*.exe
